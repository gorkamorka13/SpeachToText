name: Secret scan (API keys)

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all commits for leaked API keys
        run: |
          # Même pattern que hooks/pre-commit : Gemini (AIzaSy...), OpenRouter
          # (sk-or-v1-...), Anthropic (sk-ant-...), clés Google Cloud (AQ.Ab8RN6...)
          PATTERN='(AIzaSy[A-Za-z0-9_-]{30,}|sk-or-v1-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|AQ\.Ab8RN6[A-Za-z0-9_-]{20,})'
          LEAKS=0
          for commit in $(git rev-list --all); do
            HITS=$(git grep -nE "$PATTERN" "$commit" -- 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "::error::Clé API potentielle dans le commit $commit"
              # Sortie MASQUÉE : jamais la clé complète dans les logs CI
              echo "$HITS" | sed -E 's/(AIzaSy|sk-or-v1-|sk-ant-|AQ\.Ab8RN6)[A-Za-z0-9_-]+/[KEY_MASKED]/g' | cut -c1-160 | head -10
              LEAKS=1
            fi
          done
          if [ "$LEAKS" -ne 0 ]; then
            echo "Une clé API a été détectée dans l'historique : régénérez-la immédiatement."
            exit 1
          fi
          echo "Aucune clé API détectée dans les $(( $(git rev-list --all | wc -l) )) commits."
